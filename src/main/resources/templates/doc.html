<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知识库阅读</title>
    <!-- KaTeX 样式：渲染 cherry-markdown 已生成的公式 HTML（内置 .katex / .katex-display 排版与 KaTeX 字体） -->
    <link rel="stylesheet" th:href="@{/plugins/halo-plugin-minidocs/assets/static/katex/katex.min.css}">
    <link rel="stylesheet" th:href="@{/plugins/halo-plugin-minidocs/assets/static/doc-page.css(v=1.1.7)}">
  </head>

  <body th:with="knowledgeBase=${minidocsFinder.getKnowledgeBase(kbSlug)},
                 isCatalog=${knowledgeBase?.spec?.docMode == 'catalog'}">
    <nav class="site-nav">
      <div class="nav-brand-wrap" style="display:flex;align-items:center;gap:12px;min-width:0;">
        <a class="nav-brand" th:href="@{/}">
          <img th:if="${site.logo != null and !#strings.isEmpty(site.logo)}"
               th:src="${site.logo}" alt="logo">
          <span class="nav-logo-fallback"
                th:unless="${site.logo != null and !#strings.isEmpty(site.logo)}"
                th:text="${site.title != null and !#strings.isEmpty(site.title) ? #strings.substring(site.title, 0, 1) : '知'}">知</span>
          <span class="nav-title" th:text="${#strings.defaultString(site.title, '知识库')}">知识库</span>
        </a>
        <span class="nav-kb-badge" th:if="${knowledgeBase != null}" title="当前知识库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span class="nav-kb-name" th:text="${knowledgeBase.spec.displayName}">知识库名称</span>
        </span>
      </div>
      <div class="nav-right">
        <div class="nav-trails">
          <a class="nav-btn nav-btn--kb" th:href="@{/docs}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>返回知识库</span>
          </a>
          <button class="nav-btn icon-only nav-btn--bm" type="button" title="加入浏览器书签" onclick="mdAddBookmark()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
            </svg>
          </button>
          <button class="nav-btn icon-only nav-btn--sh" type="button" title="复制链接" onclick="mdShare(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
              <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
            </svg>
          </button>
        </div>
        <div class="nav-stats">
          <button class="nav-btn nav-btn--like" id="md-like" type="button" title="点赞这个知识库">
            <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span class="nav-stat-num" id="md-like-count">0</span>
          </button>
          <span class="nav-stat nav-stat--view" title="访问量">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="nav-stat-num" id="md-view-count">0</span>
          </span>
        </div>
        <div class="nav-user">
          <span class="dot"></span>
          <span th:text="${#strings.defaultString(loginUser, '未登录')}">未登录</span>
        </div>
      </div>
    </nav>

    <div class="md-read"
         th:with="docTreeFlat=${minidocsFinder.getDocTreeFlat(kbSlug)},
                  docSlug=${docSlug != null ? docSlug : (docTreeFlat.isEmpty() ? null : docTreeFlat[0].slug)},
                  doc=${docSlug != null ? minidocsFinder.getDocBySlug(docSlug) : null}">

      <!-- 左侧：文档树 -->
      <aside class="md-sb" id="md-sb">
        <div class="md-sb-head md-sb-head--toc">
          <div class="md-sb-head-t">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3" y2="6"></line>
              <line x1="3" y1="12" x2="3" y2="12"></line>
              <line x1="3" y1="18" x2="3" y2="18"></line>
            </svg>
            <span>目录</span>
            <span class="md-sb-count"
                  th:if="${knowledgeBase != null and knowledgeBase.status != null and knowledgeBase.status.docCount != null}"
                  th:text="${knowledgeBase.status.docCount}">0</span>
          </div>
          <button class="md-sb-foldall" id="md-foldall" type="button" title="展开 / 收起全部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 9 12 4 17 9"></polyline>
              <polyline points="7 15 12 20 17 15"></polyline>
            </svg>
          </button>
        </div>

        <div class="md-sb-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.1" y2="16.1"></line>
          </svg>
          <input type="search" id="md-doc-search" placeholder="搜索文档..." aria-label="搜索文档">
        </div>

        <div class="md-tree-wrap">
          <!-- 扁平树：后端先序展平（无递归片段，避免响应式流式渲染截断），缩进/折叠由 CSS+JS 处理 -->
          <ul class="md-tree">
            <li th:each="n : ${docTreeFlat}"
                th:classappend="${n.liClass}"
                th:attr="data-slug=${n.slug},data-name=${n.name},data-parent=${n.parentSlug},data-ancestors=${n.ancestors}">
              <!-- href 输出真实地址：JS 正常时由事件委托拦截走 AJAX（无刷新切换）；
                   JS 未加载 / 中键 / Ctrl+点击 时仍可正常打开对应文档（渐进增强）。 -->
              <a class="md-tree-link"
                 th:href="|?docSlug=${n.slug}|"
                 th:classappend="${docSlug != null and docSlug == n.slug ? 'active' : ''}"
                 th:attr="data-slug=${n.slug},data-name=${n.name},data-title=${n.title}">
                <span class="md-tree-caret" th:if="${n.dir}" title="展开 / 收起"></span>
                <span class="md-tree-caret-spacer" th:if="${isCatalog and !n.dir}"></span>
                <span class="md-tree-ico" th:if="${isCatalog}"></span>
                <span class="md-dot" th:unless="${isCatalog or n.dir}"></span>
                <span class="md-title-text" th:text="${n.title}"></span>
              </a>
            </li>
          </ul>
          <div class="md-empty md-tree-empty" th:if="${docTreeFlat.isEmpty()}"
               style="display:none">暂无文档。</div>
        </div>
      </aside>

      <div class="resize-handle sb-resize" data-resize="sb"></div>

      <!-- 中间：正文（容器常驻，无刷新切换时只替换 innerHTML） -->
      <main class="md-main" id="md-main" th:attr="data-doc-slug=${docSlug}">
        <div class="md-content" id="md-prose"
             th:utext="${doc != null and doc.spec != null ? doc.spec.content : ''}"></div>
        <div class="md-empty" id="md-empty"
             th:style="${doc != null ? 'display:none' : ''}">该知识库暂无已发布文档。</div>
      </main>

      <div class="resize-handle toc-resize" data-resize="toc"></div>

      <!-- 右侧：文章大纲 -->
      <nav class="md-toc" id="md-toc">
        <div class="md-toc-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3" y2="6"></line>
            <line x1="3" y1="12" x2="3" y2="12"></line>
            <line x1="3" y1="18" x2="3" y2="18"></line>
          </svg>
          <span>目录</span>
        </div>
        <ul class="md-toc-list" id="md-toc-list"></ul>
      </nav>

      <!-- 底部：文章信息栏（常驻，切换文档时由 doc-page.js 逐项刷新） -->
      <div class="md-bottom" id="md-bottom">
        <div class="md-bottom-info">
          <span class="md-bottom-count">共
            <b th:text="${knowledgeBase != null and knowledgeBase.status != null and knowledgeBase.status.docCount != null ? knowledgeBase.status.docCount : 0}">0</b>
            篇</span>
          <span class="sep"></span>
          <span class="md-bottom-title" id="md-route"
              th:attr="data-root=${knowledgeBase != null ? knowledgeBase.spec.displayName : ''}"
              title="文档路由路径">
            <span th:text="${knowledgeBase != null ? knowledgeBase.spec.displayName : ''}"></span>
            <span class="sep">/</span>
            <span th:text="${doc?.spec?.title}"></span>
          </span>
          <span class="sep"></span>
          <span><b id="md-words">0</b> 字</span>
          <span class="sep"></span>
          <span><b id="md-lines">0</b> 行</span>
          <span id="md-author-wrap"
                th:style="${!#strings.isEmpty(doc?.spec?.author) ? '' : 'display:none'}">
            <span class="sep"></span>
            <svg class="md-auth-ico" aria-label="作者" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="md-author" th:text="${doc?.spec?.author}"></span>
          </span>
        </div>
        <div class="md-bottom-meta">
          <span class="md-mi" id="md-mi-create"
                th:style="${doc?.metadata?.creationTimestamp != null ? '' : 'display:none'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="md-mi-label">创建</span>
            <span id="md-ts-create" class="md-ts" th:attr="data-ts=${doc?.metadata?.creationTimestamp}"
                  th:text="${doc?.metadata?.creationTimestamp}"></span>
          </span>
          <span class="md-mi" id="md-mi-update"
                th:style="${doc?.spec?.updateTime != null ? '' : 'display:none'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="md-mi-label">更新</span>
            <span id="md-ts-update" class="md-ts" th:attr="data-ts=${doc?.spec?.updateTime}"
                  th:text="${doc?.spec?.updateTime}"></span>
          </span>
          <button class="md-back-top" type="button" onclick="mdScrollTop()" title="回到顶部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="12 19 12 5"></polyline>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="md-toast" id="md-toast"></div>

    <!-- 文档树点击由 doc-page.js 事件委托接管：fetch 拉内容 + pushState 改 URL，
         全程不整页刷新，目录树展开状态得以完整保留。 -->
    <script th:inline="javascript">
      window.MD_CONF = {
        apiBase: '/apis/api.minidocs.halo.run/v1alpha1/knowledgebases/'
          + encodeURIComponent(/*[[${kbSlug}]]*/ ''),
        isCatalog: /*[[${isCatalog != null and isCatalog}]]*/ false,
        kbName: /*[[${knowledgeBase != null and knowledgeBase.spec != null and knowledgeBase.spec.displayName != null ? knowledgeBase.spec.displayName : ''}]]*/ '',
        share: false
      };
    </script>
    <script th:src="@{/plugins/halo-plugin-minidocs/assets/static/doc-page.js(v=1.3.2)}" defer></script>
  </body>
</html>
