<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知识库</title>
    <style>
      :root {
        /* 主色：emerald 绿 */
        --md-primary: #10b981;
        --md-primary-soft: #34d399;
        --md-primary-deep: #059669;
        --md-primary-ink: #047857;
        --md-primary-glow: rgba(16, 185, 129, .14);

        /* 功能色 */
        --md-c-green: #10b981;
        --md-c-green-bg: rgba(16, 185, 129, .12);
        --md-c-blue: #3b82f6;
        --md-c-blue-bg: rgba(59, 130, 246, .12);
        --md-c-purple: #8b5cf6;
        --md-c-purple-bg: rgba(139, 92, 246, .12);
        --md-c-orange: #f59e0b;
        --md-c-orange-bg: rgba(245, 158, 11, .14);

        --md-bg1: #ffffff;
        --md-bg2: #f5f7fa;
        --md-card: #ffffff;
        --md-card-hover: #ffffff;
        --md-card-shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
        --md-card-shadow-hover: 0 12px 28px rgba(5, 120, 80, .16);
        --md-border: #e5e9ef;
        --md-border-strong: #d3dce6;
        --md-title: #1f2937;
        --md-sub: #6b7280;
        --md-desc: #6b7280;
        --md-muted: #9ca3af;
        --md-tag-bg: rgba(16, 185, 129, .12);
        --md-tag: #059669;
        --md-chip-bg: #f2f6f4;
        --md-input-bg: #ffffff;
        --md-nav-h: 56px;
        --md-scroll-thumb: rgba(5, 150, 105, .28);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --md-bg1: #151b29;
          --md-bg2: #0e1420;
          --md-primary: #34d399;
          --md-primary-soft: #6ee7b7;
          --md-primary-deep: #34d399;
          --md-primary-ink: #a7f3d0;
          --md-primary-glow: rgba(52, 211, 153, .16);
          --md-c-green: #34d399;
          --md-c-green-bg: rgba(52, 211, 153, .15);
          --md-c-blue: #60a5fa;
          --md-c-blue-bg: rgba(96, 165, 250, .15);
          --md-c-purple: #a78bfa;
          --md-c-purple-bg: rgba(167, 139, 250, .15);
          --md-c-orange: #fbbf24;
          --md-c-orange-bg: rgba(251, 191, 36, .15);
          --md-card: #1a2233;
          --md-card-hover: #1e2740;
          --md-card-shadow: 0 2px 10px rgba(0, 0, 0, .35);
          --md-card-shadow-hover: 0 14px 32px rgba(0, 0, 0, .5);
          --md-border: #2a3348;
          --md-border-strong: #3a4661;
          --md-title: #eef2f7;
          --md-sub: #9aa5b8;
          --md-desc: #a3aebb;
          --md-muted: #6b7688;
          --md-tag-bg: rgba(52, 211, 153, .16);
          --md-tag: #6ee7b7;
          --md-chip-bg: #1c2536;
          --md-input-bg: #1a2233;
          --md-scroll-thumb: rgba(52, 211, 153, .3);
        }
      }

      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--md-scroll-thumb) transparent; }

      body {
        margin: 0;
        background: var(--md-bg2);
        color: var(--md-title);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Roboto, sans-serif;
      }

      /* ---------- 应用容器：占满视口、无页面滚动 ---------- */
      .md-app {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ---------- 顶部导航：logo + 登录人 ---------- */
      .site-nav {
        flex: 0 0 auto;
        height: var(--md-nav-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: var(--md-bg1);
        border-bottom: 1px solid var(--md-border);
        z-index: 60;
      }
      .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--md-title); }
      .nav-brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
      .nav-logo-fallback {
        width: 30px; height: 30px;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, var(--md-primary-soft), var(--md-primary-deep));
        border-radius: 8px;
      }
      .nav-title { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
      .nav-user {
        display: flex; align-items: center; gap: 8px;
        color: var(--md-sub); font-size: 14px;
        background: var(--md-bg2);
        border: 1px solid var(--md-border);
        border-radius: 999px; padding: 5px 14px;
      }
      .nav-user .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--md-primary); box-shadow: 0 0 0 3px var(--md-primary-glow); }
      .nav-user .name { font-weight: 600; }

      /* ---------- 主体内容 ---------- */
      .md-content {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 1560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 16px 22px 12px;
      }

      /* ---------- 顶部看板 ---------- */
      .md-stats {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .md-stat {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        background: var(--md-card);
        border: 1px solid var(--md-border);
        border-radius: 14px;
        padding: 13px 15px;
        box-shadow: var(--md-card-shadow);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      }
      .md-stat:hover { transform: translateY(-2px); border-color: var(--md-border-strong); box-shadow: var(--md-card-shadow-hover); }
      .md-stat-ico {
        flex: 0 0 auto;
        width: 38px; height: 38px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 11px;
      }
      .md-stat-ico svg { width: 20px; height: 20px; }
      .md-stat-ico.is-green { background: var(--md-c-green-bg); color: var(--md-c-green); }
      .md-stat-ico.is-blue { background: var(--md-c-blue-bg); color: var(--md-c-blue); }
      .md-stat-ico.is-purple { background: var(--md-c-purple-bg); color: var(--md-c-purple); }
      .md-stat-ico.is-orange { background: var(--md-c-orange-bg); color: var(--md-c-orange); }
      .md-stat-val { font-size: 21px; font-weight: 800; line-height: 1.1; color: var(--md-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .md-stat-val.is-text { font-size: 14px; line-height: 1.25; padding-top: 2px; }
      .md-stat-label { font-size: 11.5px; color: var(--md-sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- 工具栏：搜索 + 排序 + 视图切换 ---------- */
      .md-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
      }
      .md-sec-title {
        flex: 0 0 auto;
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 16px; font-weight: 800; color: var(--md-title);
        white-space: nowrap;
      }
      .md-sec-title .ico {
        width: 28px; height: 28px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 9px;
        background: var(--md-primary-glow); color: var(--md-primary-deep);
      }
      .md-sec-title .ico svg { width: 16px; height: 16px; }
      .md-search { position: relative; flex: 0 1 320px; margin-left: auto; }
      .md-search .lens {
        position: absolute; left: 13px; top: 50%;
        transform: translateY(-50%);
        width: 17px; height: 17px; color: var(--md-muted); pointer-events: none;
      }
      .md-search .kbd {
        position: absolute; right: 12px; top: 50%;
        transform: translateY(-50%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px; color: var(--md-muted);
        background: var(--md-bg2); border: 1px solid var(--md-border);
        border-radius: 6px; padding: 2px 6px; pointer-events: none;
      }
      .md-search input {
        width: 100%;
        padding: 9px 44px 9px 38px;
        border-radius: 999px;
        border: 1px solid var(--md-border);
        background: var(--md-input-bg);
        box-shadow: var(--md-card-shadow);
        font-size: 13.5px; color: var(--md-title);
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .md-search input::placeholder { color: var(--md-muted); }
      .md-search input:focus { border-color: var(--md-primary-soft); box-shadow: 0 0 0 3px var(--md-primary-glow); }

      .md-toolbar-right { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }
      .md-sort { position: relative; display: inline-flex; align-items: center; }
      .md-sort svg { position: absolute; left: 11px; width: 15px; height: 15px; color: var(--md-muted); pointer-events: none; }
      .md-sort select {
        appearance: none; -webkit-appearance: none;
        font-size: 13px; font-family: inherit; color: var(--md-title);
        background: var(--md-chip-bg);
        border: 1px solid var(--md-border); border-radius: 10px;
        padding: 8px 28px 8px 32px;
        cursor: pointer; outline: none;
      }
      .md-sort::after {
        content: ''; position: absolute; right: 12px; top: 50%;
        width: 7px; height: 7px;
        transform: translateY(-70%) rotate(45deg);
        border-right: 1.5px solid var(--md-muted);
        border-bottom: 1.5px solid var(--md-muted);
        pointer-events: none;
      }
      .md-sort select:hover { border-color: var(--md-primary-soft); }
      .md-sort select:focus { border-color: var(--md-primary); }

      .md-view { display: inline-flex; align-items: center; gap: 3px; background: var(--md-chip-bg); border: 1px solid var(--md-border); border-radius: 10px; padding: 3px; }
      .md-view button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 27px;
        border: none; background: transparent; border-radius: 7px; cursor: pointer;
        color: var(--md-muted); transition: all .15s ease;
      }
      .md-view button svg { width: 17px; height: 17px; }
      .md-view button:hover { color: var(--md-primary-deep); }
      .md-view button.active { background: var(--md-card); color: var(--md-primary-deep); box-shadow: var(--md-card-shadow); }

      /* ---------- 主区：侧栏 + 内容 ---------- */
      .md-main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        gap: 18px;
        margin-top: 14px;
      }

      /* 侧栏 */
      .md-sidebar {
        flex: 0 0 268px;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-right: 4px;
      }
      .sb-card {
        background: var(--md-card);
        border: 1px solid var(--md-border);
        border-radius: 14px;
        box-shadow: var(--md-card-shadow);
        overflow: hidden;
      }
      .sb-head {
        display: flex; align-items: center; gap: 8px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--md-border);
        font-size: 13.5px; font-weight: 700; color: var(--md-title);
      }
      .sb-head svg { width: 16px; height: 16px; color: var(--md-primary-deep); flex: 0 0 auto; }
      .sb-head svg.h-purple { color: var(--md-c-purple); }
      .sb-head svg.h-orange { color: var(--md-c-orange); }
      .sb-more {
        margin-left: auto; border: none; background: none; padding: 0;
        font-family: inherit; font-size: 12px; font-weight: 600;
        color: var(--md-primary-deep); cursor: pointer; white-space: nowrap;
      }
      .sb-more:hover { text-decoration: underline; }
      .sb-list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
      a.sb-item, .sb-item {
        display: flex; align-items: center; gap: 9px;
        padding: 8px 10px; border-radius: 9px; cursor: pointer;
        text-decoration: none; color: inherit;
        transition: background .15s ease;
      }
      a.sb-item:hover, .sb-item:hover { background: var(--md-primary-glow); }
      .sb-ico {
        flex: 0 0 auto; width: 27px; height: 27px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 8px;
        background: var(--md-primary-glow); color: var(--md-primary-deep);
      }
      .sb-ico svg { width: 13px; height: 13px; }
      .sb-txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .sb-item .t { font-size: 13px; font-weight: 600; color: var(--md-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sb-item .m { font-size: 11.5px; color: var(--md-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sb-item .m .live {
        display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        background: var(--md-primary); margin-right: 5px; vertical-align: 1px;
        animation: mdPulse 2.2s ease-in-out infinite;
      }
      @keyframes mdPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      .sb-empty { padding: 14px; color: var(--md-muted); font-size: 12.5px; }

      /* 标签云 */
      .tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 14px; }
      .tag-chip {
        font-size: 12px; font-weight: 600;
        color: var(--md-tag); background: var(--md-tag-bg);
        border: 1px solid transparent; border-radius: 999px;
        padding: 4px 10px; cursor: pointer; transition: all .15s ease;
        font-family: inherit;
      }
      .tag-chip:hover { border-color: var(--md-primary-soft); transform: translateY(-1px); }
      .tag-chip.active { background: var(--md-primary-deep); color: #fff; }
      .tag-chip .n { opacity: .7; margin-left: 2px; }

      /* 今日动态 */
      .welcome { display: flex; align-items: center; gap: 11px; padding: 13px 14px 4px; }
      .welcome-ava {
        flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, var(--md-primary-soft), var(--md-primary-deep));
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 17px; font-weight: 800;
        box-shadow: 0 4px 10px var(--md-primary-glow);
      }
      .welcome-hi { font-size: 14px; font-weight: 800; color: var(--md-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .welcome-sub { font-size: 12px; color: var(--md-sub); margin-top: 2px; }
      .welcome-tip { font-size: 11.5px; color: var(--md-muted); line-height: 1.6; padding: 8px 14px 0; }
      .owner-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 11px 14px 14px; align-items: center; }
      .owner-row .lbl { font-size: 11.5px; color: var(--md-muted); margin-right: 2px; }
      .owner-chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 10px 3px 3px;
        background: var(--md-card); border: 1px solid var(--md-border);
        border-radius: 999px; cursor: pointer;
        transition: transform .15s ease, border-color .15s ease,
          box-shadow .15s ease, background .15s ease;
      }
      .owner-chip:hover { transform: translateY(-1px); border-color: var(--md-primary-soft); }
      .owner-ava {
        flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        color: #fff;
      }
      .owner-ava svg { width: 14px; height: 14px; }
      .owner-name {
        font-size: 12px; font-weight: 600; color: var(--md-title);
        max-width: 96px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap;
      }
      .owner-chip.active {
        border-color: var(--md-primary);
        box-shadow: 0 0 0 3px var(--md-primary-glow);
        background: var(--md-primary-soft);
      }
      .owner-chip.active .owner-name { color: var(--md-primary-deep); }

      /* 右内容列 */
      .md-col { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .md-count-line { font-size: 12.5px; color: var(--md-sub); padding: 2px 2px 10px; }
      .md-count-line b { color: var(--md-primary-deep); font-weight: 700; }

      .md-list-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; }
      .md-grid { display: grid; grid-template-columns: repeat(auto-fill, 286px); justify-content: start; gap: 16px; }

      /* ---------- 卡片 ---------- */
      .md-kb-card {
        position: relative;
        display: flex; flex-direction: column;
        text-decoration: none; color: inherit;
        background: var(--md-card);
        border: 1px solid var(--md-border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--md-card-shadow);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      }
      .md-kb-card:hover { transform: translateY(-4px); box-shadow: var(--md-card-shadow-hover); border-color: var(--md-border-strong); background: var(--md-card-hover); }
      .md-kb-card.is-hidden { display: none; }

      .md-cover { position: relative; flex: 0 0 auto; overflow: hidden; }
      .md-cover .img-inner {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(120% 140% at 20% 10%, var(--md-primary-soft) 0%, transparent 55%),
          linear-gradient(135deg, #0ca678, #0b3b33);
      }
      .md-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
      .md-kb-card:hover .md-cover img { transform: scale(1.05); }
      .md-cover .img-inner { position: relative; }
      .fallback-mark {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 72px; font-weight: 900; line-height: 1;
        color: rgba(255,255,255,.18);
        letter-spacing: -1px;
        transition: transform .4s ease, color .4s ease;
        pointer-events: none; user-select: none;
      }
      .md-kb-card:hover .fallback-mark { transform: scale(1.08); color: rgba(255,255,255,.28); }
      .md-cover-static-bg { position: absolute; inset: 0; overflow: hidden; }
      .md-cover-static-bg::after {
        content: ''; position: absolute; right: -34px; bottom: -44px;
        width: 150px; height: 150px; border-radius: 50%;
        background: rgba(255,255,255,.09);
      }
      .md-cover-static-bg::before {
        content: ''; position: absolute; left: -22px; top: -32px;
        width: 92px; height: 92px; border-radius: 50%;
        background: rgba(255,255,255,.06);
      }
      .md-cover-chip {
        position: absolute; top: 10px; left: 10px; z-index: 2;
        max-width: 56%;
        font-size: 11px; font-weight: 700; color: #fff;
        background: rgba(0,0,0,.34);
        border: 1px solid rgba(255,255,255,.28);
        backdrop-filter: blur(5px);
        padding: 2px 9px; border-radius: 999px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .md-like-btn {
        position: absolute; top: 10px; right: 10px; z-index: 2;
        width: 28px; height: 28px;
        display: inline-flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,.34);
        border: 1px solid rgba(255,255,255,.28);
        backdrop-filter: blur(5px);
        border-radius: 8px; cursor: pointer; color: #fff;
        transition: background .15s ease, border-color .15s ease, transform .15s ease;
        outline: none;
      }
      .md-like-btn svg { width: 14px; height: 14px; fill: none; transition: fill .15s ease; }
      .md-like-btn:hover { background: #f43f5e; border-color: transparent; transform: scale(1.06); }
      .md-like-btn:hover svg { fill: currentColor; }
      .md-like-btn:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,.45); }
      .md-like-btn.active { background: #f43f5e; border-color: transparent; }
      .md-like-btn.active svg { fill: currentColor; }
      .md-like-btn.popping svg { animation: md-heart-pop .55s ease; }
      @keyframes md-heart-pop {
        0% { transform: scale(1); }
        30% { transform: scale(1.35); }
        55% { transform: scale(.9); }
        100% { transform: scale(1); }
      }

      .md-body { padding: 13px 15px 0; display: flex; flex-direction: column; flex: 1 1 auto; }
      .md-title-row { display: flex; align-items: flex-start; gap: 6px; }
      .md-title { margin: 0 0 8px; font-size: 15px; font-weight: 800; line-height: 1.45; color: var(--md-title); }
      .md-title-badge {
        flex: 0 0 auto;
        display: inline-flex; align-items: center; gap: 3px;
        font-size: 10.5px; font-weight: 700; color: var(--md-primary-deep);
        background: var(--md-primary-glow); border-radius: 999px;
        padding: 3px 8px; white-space: nowrap;
      }
      .md-title-badge svg { width: 11px; height: 11px; }
      .md-desc { margin: 0; min-height: 32px; font-size: 12.5px; line-height: 1.55; color: var(--md-desc); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .md-tags { display: flex; flex-wrap: wrap; gap: 5px; min-height: 20px; padding: 9px 0 3px; }
      .md-tag { font-size: 11px; font-weight: 600; color: var(--md-tag); background: var(--md-tag-bg); border-radius: 999px; padding: 2px 8px; }

      .md-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 9px 15px 12px; border-top: 1px dashed var(--md-border); }
      .md-foot-badges { display: inline-flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
      .md-foot-meta { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; color: var(--md-muted); }
      .md-time { font-size: 11.5px; }

      /* ---------- 列表视图 ---------- */
      .md-grid.is-list { grid-template-columns: 1fr; gap: 9px; }
      .md-grid.is-list .md-kb-card { flex-direction: row; align-items: center; }
      .md-grid.is-list .md-cover { flex: 0 0 132px; }
      .md-grid.is-list .img-inner { aspect-ratio: auto; height: 100%; min-height: 96px; }
      .md-grid.is-list .fallback-mark { font-size: 44px; }
      .md-grid.is-list .md-cover-static-bg::after { width: 90px; height: 90px; right: -24px; bottom: -30px; }
      .md-grid.is-list .md-cover-static-bg::before { width: 56px; height: 56px; }
      .md-grid.is-list .md-like-btn { top: 8px; right: 8px; }
      .md-grid.is-list .md-body { flex: 1 1 auto; min-width: 0; padding: 12px 16px 12px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
      .md-grid.is-list .md-title { min-height: 0; margin: 0; -webkit-line-clamp: 1; }
      .md-grid.is-list .md-desc { min-height: 0; -webkit-line-clamp: 1; margin: 0; }
      .md-grid.is-list .md-tags { min-height: 0; padding: 0; }
      .md-grid.is-list .md-foot { flex: 0 0 auto; align-self: center; flex-direction: row; align-items: center; gap: 8px; margin-top: 0; border-top: none; border-left: 1px dashed var(--md-border); border-radius: 0; padding: 10px 16px; }
      .md-grid.is-list .md-foot .md-foot-meta { margin-left: 0; flex-direction: column; align-items: flex-end; gap: 2px; }

      /* ---------- 分页 ---------- */
      .md-pager-wrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--md-border); }
      .md-pager { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .md-pager button {
        min-width: 30px; height: 30px; padding: 0 8px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 600; font-family: inherit;
        color: var(--md-sub); background: var(--md-card);
        border: 1px solid var(--md-border); border-radius: 8px; cursor: pointer;
        transition: all .15s ease;
      }
      .md-pager button:hover:not(:disabled):not(.active) { border-color: var(--md-primary-soft); color: var(--md-primary-deep); }
      .md-pager button.active { background: linear-gradient(135deg, var(--md-primary-soft), var(--md-primary-deep)); border-color: transparent; color: #fff; box-shadow: 0 4px 12px var(--md-primary-glow); }
      .md-pager button:disabled { opacity: .4; cursor: not-allowed; }
      .md-pager button.sep { border: none; background: none; pointer-events: none; }
      .md-count { font-size: 13px; color: var(--md-sub); }
      .md-count b { color: var(--md-primary-deep); font-weight: 700; }

      .md-empty {
        display: none;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; color: var(--md-muted);
        min-height: 240px; padding: 40px 20px; font-size: 14px;
      }
      .md-empty svg { width: 48px; height: 48px; margin-bottom: 14px; opacity: .45; }
      .md-empty .md-empty-text { max-width: 340px; line-height: 1.7; }
      .md-empty-btn {
        display: none;
        margin-top: 14px; border: none; cursor: pointer;
        font-family: inherit; font-size: 13px; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, var(--md-primary-soft), var(--md-primary-deep));
        border-radius: 8px; padding: 8px 20px;
        box-shadow: 0 4px 12px var(--md-primary-glow);
      }

      @media (max-width: 1080px) {
        .md-sidebar { display: none; }
        .md-stat { padding: 10px 12px; gap: 9px; border-radius: 12px; }
        .md-stat-ico { width: 32px; height: 32px; border-radius: 9px; }
        .md-stat-ico svg { width: 17px; height: 17px; }
        .md-stat-val { font-size: 18px; }
        .md-stat-val.is-text { font-size: 12.5px; }
        .md-stat-label { font-size: 11px; margin-top: 2px; }
      }
      @media (max-width: 640px) {
        .md-content { padding: 12px 12px 8px; }
        .md-toolbar { flex-wrap: wrap; }
        .md-toolbar-right { margin-left: auto; }
        .md-search { flex: 1 1 100%; }
        .md-stats { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 2px; }
        .md-stat { flex: 0 0 auto; min-width: 150px; }
      }

      /* 轻提示 */
      .md-toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 20px);
        background: #111827;
        color: #fff;
        padding: 8px 16px;
        font-size: 13px;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
        z-index: 999;
      }
      .md-toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>

  <body>
    <div class="md-app"
         th:with="result=${minidocsFinder.listKnowledgeBases(1, 1000)}">
      <nav class="site-nav">
        <a class="nav-brand" th:href="@{/}">
          <img th:if="${site.logo != null and !#strings.isEmpty(site.logo)}"
               th:src="${site.logo}" alt="logo">
          <span class="nav-logo-fallback"
                th:unless="${site.logo != null and !#strings.isEmpty(site.logo)}"
                th:text="${site.title != null and !#strings.isEmpty(site.title) ? #strings.substring(site.title, 0, 1) : '知'}">知</span>
          <span class="nav-title" th:text="${#strings.defaultString(site.title, '知识库')}">知识库</span>
        </a>
        <div class="nav-user">
          <span class="dot"></span>
          <span class="name" th:text="${#strings.defaultString(loginUser, '未登录')}">未登录</span>
        </div>
      </nav>

      <div class="md-content">
        <div class="md-stats">
          <div class="md-stat">
            <span class="md-stat-ico is-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
            <div style="min-width:0"><div class="md-stat-val" id="md-stat-kb">0</div><div class="md-stat-label">知识库总数</div></div>
          </div>
          <div class="md-stat">
            <span class="md-stat-ico is-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg></span>
            <div style="min-width:0"><div class="md-stat-val" id="md-stat-docs">0</div><div class="md-stat-label">笔记总数</div></div>
          </div>
          <div class="md-stat">
            <span class="md-stat-ico is-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
            <div style="min-width:0"><div class="md-stat-val" id="md-stat-tags">0</div><div class="md-stat-label">标签数量</div></div>
          </div>
          <div class="md-stat">
            <span class="md-stat-ico is-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            <div style="min-width:0"><div class="md-stat-val" id="md-stat-avg">0</div><div class="md-stat-label">访问量</div></div>
          </div>
          <div class="md-stat">
            <span class="md-stat-ico is-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>
            <div style="min-width:0"><div class="md-stat-val" id="md-stat-new">0</div><div class="md-stat-label">点赞量</div></div>
          </div>
        </div>

        <div class="md-toolbar">
          <div class="md-sec-title">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><path d="M9 21V12h6v9"/></svg></span>
            <span>全部知识库</span>
          </div>
          <div class="md-search">

            <input type="search" id="md-search-input" placeholder="搜索知识库，或输入标签筛选..." aria-label="搜索知识库">

          </div>
          <div class="md-toolbar-right">
            <label class="md-sort">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3l-4 8h8l-4-8V3"/><path d="M16 12h6M19 9v6"/></svg>
              <select id="md-sort" aria-label="排序方式">
                <option value="update" selected>最近更新</option>
                <option value="docs">文档最多</option>
                <option value="name">名称 A-Z</option>
                <option value="created">最新创建</option>

            </label>
            <div class="md-view" aria-label="视图切换">
              <button type="button" data-view="card" class="active" title="卡片视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
              <button type="button" data-view="list" title="列表视图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg></button>
            </div>
          </div>
        </div>

        <div class="md-main">
          <!-- 左侧信息侧栏 -->
          <aside class="md-sidebar">
            <div class="sb-card">
              <div class="sb-head">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                最近更新
                <button type="button" class="sb-more" id="sb-recent-more">查看全部</button>
              </div>
              <div class="sb-list" id="sb-recent"></div>
            </div>

            <div class="sb-card">
              <div class="sb-head">
                <svg class="h-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r=".5" fill="currentColor"/></svg>
                标签分类
              </div>
              <div class="tag-cloud" id="sb-tags"></div>
            </div>

            <div class="sb-card">
              <div class="sb-head">
                <svg class="h-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
                今日动态
              </div>
              <div class="welcome">
                <span class="welcome-ava" id="welcome-ava">友</span>
                <div style="min-width:0">
                  <div class="welcome-hi" id="welcome-name">朋友</div>
                  <div class="welcome-sub">欢迎回来!</div>
                </div>
              </div>
              <div class="welcome-tip" id="welcome-tip"></div>
              <div class="owner-row" id="sb-owners"></div>
            </div>
          </aside>

          <!-- 右内容 -->
          <section class="md-col">
            <div class="md-count-line">
              共 <b id="md-count">0</b> 个知识库
            </div>
            <div class="md-list-area" id="md-list-area">
              <div class="md-grid is-card" id="md-grid">
                <a class="md-kb-card"
                   th:each="kb : ${result.items}"
                   th:attr="data-search=${kb.spec.displayName} + ' ' +
                             ${kb.spec.description != null ? kb.spec.description : ''} + ' ' +
                             ${kb.spec.tags != null ? #strings.listJoin(kb.spec.tags, ' ') : ''} + ' ' +
                             ${kb.spec.creatorName != null ? kb.spec.creatorName : ''},
                     data-tags=${kb.spec.tags != null ? #strings.listJoin(kb.spec.tags, ' ') : ''},
                     data-owner=${kb.spec.creatorName != null ? kb.spec.creatorName : ''},
                     data-name=${#strings.toLowerCase(kb.spec.displayName)},
                     data-slug=${kb.spec.slug != null && !kb.spec.slug.isEmpty() ? kb.spec.slug : kb.metadata.name},
                     data-docs=${kb.status != null and kb.status.docCount != null ? kb.status.docCount : 0},
                     data-access=${kb.spec.accessCount != null ? kb.spec.accessCount : 0},
                     data-like=${kb.spec.likeCount != null ? kb.spec.likeCount : 0},
                     data-liked=${loginUser != null and !#strings.isEmpty(loginUser)
                                and kb.spec.likedUsers != null
                                and kb.spec.likedUsers.contains(loginUser) ? '1' : '0'},
                     data-update=${kb.spec.updateTime != null ? kb.spec.updateTime : ''},
                     data-created=${kb.spec.creationTime != null ? kb.spec.creationTime : ''}"
                   th:href="@{'/docs/view/' +
                             ${kb.spec.slug != null && !kb.spec.slug.isEmpty()
                               ? kb.spec.slug : kb.metadata.name}}">
                  <div class="md-cover"
                       th:if="${kb.spec.cover != null and !kb.spec.cover.isEmpty()}">
                    <div class="img-inner"><img th:src="${kb.spec.cover}" alt="" loading="lazy"></div>

                  <div class="md-cover md-cover-static"
                       th:unless="${kb.spec.cover != null and !kb.spec.cover.isEmpty()}">
                    <span class="md-cover-static-bg" aria-hidden="true"></span>
                    <div class="img-inner">
                      <span class="fallback-mark"
                            th:text="${!#strings.isEmpty(kb.spec.displayName) ? #strings.substring(kb.spec.displayName, 0, 1) : '库'}">库</span>
                    </div>
                  </div>
                  <span class="md-cover-chip"
                        th:if="${kb.spec.tags != null and !kb.spec.tags.isEmpty()}"
                        th:text="${kb.spec.tags[0]}"></span>
                  <span class="md-like-btn" role="button" tabindex="0" aria-label="点赞这个知识库" title="点赞">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </span>
                  <div class="md-body">
                    <h3 class="md-title" th:text="${kb.spec.displayName}"></h3>
                    <p class="md-desc" th:text="${kb.spec.description != null and !kb.spec.description.isEmpty() ? kb.spec.description : '暂无简介'}">暂无简介</p>
                  </div>
                  <div class="md-foot">
                    <span class="md-foot-badges">
                      <span class="md-title-badge" title="包含文档数">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                        <span th:text="${kb.status != null and kb.status.docCount != null ? kb.status.docCount : 0}">0</span>

                      <span class="md-title-badge" title="访问量">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span th:text="${kb.spec.accessCount != null ? kb.spec.accessCount : 0}">0</span>
                      </span>
                      <span class="md-title-badge md-like-badge" title="点赞量">

          </section>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var grid = document.getElementById('md-grid');
        if (!grid) return;
        var all = Array.prototype.slice.call(grid.querySelectorAll('.md-kb-card'));
        var state = { q: '', tag: '', owner: '', sort: 'update', page: 1, perPage: 9, view: 'card' };

        var toastEl = null;
        function toast(msg) {
          if (!toastEl) {
            toastEl = document.createElement('div');
            toastEl.className = 'md-toast';
            document.body.appendChild(toastEl);
          }
          toastEl.textContent = msg;
          toastEl.classList.add('show');
          clearTimeout(toastEl._t);
          toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
        }

        var PALETTE = [
          'linear-gradient(135deg,#e11d48,#fb7185)',
          'linear-gradient(135deg,#0f766e,#14b8a6)',
          'linear-gradient(135deg,#4f46e5,#818cf8)',
          'linear-gradient(135deg,#0284c7,#38bdf8)',
          'linear-gradient(135deg,#059669,#34d399)',
          'linear-gradient(135deg,#b45309,#f59e0b)',
          'linear-gradient(135deg,#7c3aed,#c084fc)',
          'linear-gradient(135deg,#15803d,#4ade80)',
          'linear-gradient(135deg,#334155,#94a3b8)'
        ];
        function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
        function pad(n) { return n < 10 ? '0' + n : n; }
        function nowDate() { return new Date(); }

        /* 准备卡片数据缓存 */
        var cards = all.map(function (c) {
          return {
            el: c,
            search: (c.dataset.search || '').toLowerCase(),
            tags: (c.dataset.tags || '').trim().split(/\s+/).filter(Boolean),
            owner: c.dataset.owner || '',
            name: c.dataset.name || '',
            docs: parseInt(c.dataset.docs || '0', 10),
            access: parseInt(c.dataset.access || '0', 10),
            like: parseInt(c.dataset.like || '0', 10),
            update: Date.parse(c.dataset.update || '') || 0,
            created: Date.parse(c.dataset.created || '') || 0,
            href: c.getAttribute('href'),
            title: c.querySelector('.md-title') ? c.querySelector('.md-title').textContent : ''
          };
        });

        function relTime(iso, fallback) {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return fallback;
          var now = nowDate();
          if (d.toDateString() === now.toDateString()) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
          var yest = new Date(now.getTime() - 86400000);
          if (d.toDateString() === yest.toDateString()) return '昨天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
          if (d.getFullYear() === now.getFullYear()) return pad(d.getMonth() + 1) + '-' + pad(d.getDate());
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        /* ---- 点赞（一次性；与阅读页共用 localStorage 键，匿名也可点赞） ---- */
        function likeKey(slug) { return 'minidocs:like:' + slug; }
        function locallyLiked(slug) {
          try { return localStorage.getItem(likeKey(slug)) === '1'; } catch (e) { return false; }
        }
        cards.forEach(function (card) {
          var btn = card.el.querySelector('.md-like-btn');
          if (!btn) return;
          var slug = card.el.getAttribute('data-slug') || '';
          if (!slug) return;
          var badge = card.el.querySelector('.md-like-badge span');
          var likedByServer = card.el.getAttribute('data-liked') === '1';
          function markLiked() {
            btn.classList.add('active');
            btn.classList.remove('popping');
            void btn.offsetWidth;
            btn.classList.add('popping');
          }
          if (likedByServer || locallyLiked(slug)) btn.classList.add('active');
          btn.setAttribute('aria-label', '点赞：' + card.title);
          btn.setAttribute('title', '点赞：' + card.title);
          function doLike() {
            if (likedByServer || locallyLiked(slug)) { toast('该知识库已点赞过了'); markLiked(); return; }
            fetch('/apis/api.minidocs.halo.run/v1alpha1/knowledgebases/'
                + encodeURIComponent(slug) + '/like', { method: 'POST', credentials: 'include' })
              .then(function (r) { if (!r.ok) throw 0; return r.json(); })
              .then(function (data) {
                try { localStorage.setItem(likeKey(slug), '1'); } catch (e) { /* 忽略隐私模式 */ }
                markLiked();
                var isNew = !data || data.newLike !== false;
                if (data && typeof data.likeCount === 'number') {
                  if (badge) badge.textContent = data.likeCount;
                  if (isNew) {
                    var stat = document.getElementById('md-stat-new');
                    if (stat) stat.textContent = (parseInt(stat.textContent, 10) || 0) + 1;
                  }
                }
                toast(isNew ? '点赞成功' : '该知识库已经点过赞了');
              })
              .catch(function () { toast('点赞失败，请稍后重试'); });
          }
          btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); doLike(); });
          btn.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); doLike(); }
          });
        });

        /* 无封面渐变 + 时间 */
        cards.forEach(function (card) {
          var staticBg = card.el.querySelector('.md-cover-static .md-cover-static-bg');
          if (staticBg) staticBg.style.background = PALETTE[hash(card.name || card.search) % PALETTE.length];
          var t = card.el.querySelector('.md-time');
          if (t) t.textContent = card.update ? relTime(new Date(card.update).toISOString(), '') : '';
        });

        /* ---- 顶部看板 ---- */
        var totalKb = cards.length;
        var totalDocs = cards.reduce(function (s, c) { return s + c.docs; }, 0);
        var tagCounter = {};
        var ownerCounter = {};
        cards.forEach(function (c) {
          c.tags.forEach(function (t) { tagCounter[t] = (tagCounter[t] || 0) + 1; });
          if (c.owner) ownerCounter[c.owner] = (ownerCounter[c.owner] || 0) + 1;
        });
        var tagList = Object.keys(tagCounter).sort(function (a, b) { return tagCounter[b] - tagCounter[a] || a.localeCompare(b); });
        var ownerList = Object.keys(ownerCounter).sort(function (a, b) { return ownerCounter[b] - ownerCounter[a] || a.localeCompare(b); });
        var totalAccess = cards.reduce(function (s, c) { return s + c.access; }, 0);
        var totalLike = cards.reduce(function (s, c) { return s + c.like; }, 0);

        document.getElementById('md-stat-kb').textContent = totalKb;
        document.getElementById('md-stat-docs').textContent = totalDocs;
        document.getElementById('md-stat-tags').textContent = tagList.length;
        document.getElementById('md-stat-avg').textContent = totalAccess;
        document.getElementById('md-stat-new').textContent = totalLike;

        /* ---- 侧栏：标签云 ---- */
        var tagCloud = document.getElementById('sb-tags');
        if (tagCloud) {
          if (!tagList.length) { tagCloud.innerHTML = '<div class="sb-empty">暂无标签</div>'; }
          else tagList.forEach(function (tag) {
            var chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'tag-chip';
            chip.setAttribute('data-tag', tag);
            chip.innerHTML = tag + '<span class="n">' + tagCounter[tag] + '</span>';
            chip.addEventListener('click', function () {
              state.tag = state.tag === tag ? '' : tag;
              state.page = 1;
              document.querySelectorAll('.tag-chip').forEach(function (b) {
                b.classList.toggle('active', (b.getAttribute('data-tag') || '') === state.tag);
              });
              render();
            });
            tagCloud.appendChild(chip);
          });
        }

        /* ---- 侧栏：最近更新 ---- */
        var recentEl = document.getElementById('sb-recent');
        if (recentEl) {
          var recent = cards.slice().sort(function (a, b) { return b.update - a.update; }).slice(0, 5).filter(function (c) { return c.update > 0; });
          if (!recent.length) recentEl.innerHTML = '<div class="sb-empty">暂无数据</div>';
          else recent.forEach(function (c) {
            var a = document.createElement('a');
            a.className = 'sb-item';
            a.href = c.href;
            a.innerHTML =
              '<span class="sb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>' +
              '<span class="sb-txt">' +
              '<span class="t"></span>' +
              '<span class="m"><i class="live"></i>' + c.docs + ' 篇 · ' + relTime(new Date(c.update).toISOString(), '') + '</span>' +
              '</span>';
            a.querySelector('.t').textContent = c.title;
            recentEl.appendChild(a);
          });
        }

        /* ---- 侧栏：今日动态（欢迎 + 贡献者） ---- */
        var navNameEl = document.querySelector('.nav-user .name');
        var navName = navNameEl ? (navNameEl.textContent || '').trim() : '';
        var who = (navName && navName !== '未登录') ? navName : (ownerList[0] || '朋友');
        var wa = document.getElementById('welcome-ava');
        var wn = document.getElementById('welcome-name');
        if (wa) wa.textContent = (who.charAt(0) || '友').toUpperCase();
        if (wn) wn.textContent = who;

        var dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
        var todayCount = cards.filter(function (c) { return c.update >= dayStart.getTime(); }).length;
        var tipEl = document.getElementById('welcome-tip');
        if (tipEl) {
          var tip = todayCount ? ('今日更新 <b style="color:var(--md-primary-deep)">' + todayCount + '</b> 个知识库') : '今天还没有新的更新';
          tip += ' · 共 ' + totalDocs + ' 篇文档';
          tipEl.innerHTML = tip;
        }

        var ownersEl = document.getElementById('sb-owners');
        if (ownersEl) {
          if (!ownerList.length) ownersEl.innerHTML = '<div class="sb-empty">暂无数据</div>';
          else {
            var lbl = document.createElement('span');
            lbl.className = 'lbl';
            lbl.textContent = '贡献者';
            ownersEl.appendChild(lbl);
            ownerList.forEach(function (owner, i) {
              var chip = document.createElement('span');
              chip.className = 'owner-chip';
              chip.setAttribute('data-owner', owner);
              chip.setAttribute('role', 'button');
              chip.setAttribute('tabindex', '0');
              chip.title = owner + ' · ' + ownerCounter[owner] + ' 个知识库';
              var ava = document.createElement('span');
              ava.className = 'owner-ava';
              ava.style.background = PALETTE[i % PALETTE.length];
              ava.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
              var name = document.createElement('span');
              name.className = 'owner-name';
              name.textContent = owner;
              chip.appendChild(ava);
              chip.appendChild(name);
              chip.addEventListener('click', function () {
                state.owner = state.owner === owner ? '' : owner;
                state.page = 1;
                document.querySelectorAll('.owner-chip').forEach(function (o) {
                  o.classList.toggle('active', o.getAttribute('data-owner') === state.owner);
                });
                render();
              });
              ownersEl.appendChild(chip);
            });
          }
        }

        /* ---- 筛选 / 排序 / 分页 ---- */
        function matches(c) {
          if (state.q && c.search.indexOf(state.q) === -1) return false;
          if (state.tag && c.tags.indexOf(state.tag) === -1) return false;
          if (state.owner && c.owner !== state.owner) return false;
          return true;
        }
        function sorter(a, b) {
          switch (state.sort) {
            case 'name': return (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
            case 'docs': return b.docs - a.docs;
            case 'created': return b.created - a.created;
            default: return b.update - a.update;
          }
        }

        var countEl = document.getElementById('md-count');
        var countTotalEl = document.getElementById('md-count-total');
        var emptyEl = document.getElementById('md-empty');
        var emptyBtn = document.getElementById('md-empty-reset');
        var listArea = document.getElementById('md-list-area');
        var pagerEl = document.getElementById('md-pager');
        var gridEl = document.getElementById('md-grid');

        function render() {
          var pool = cards.filter(matches);
          pool.sort(sorter);
          var pages = Math.max(1, Math.ceil(pool.length / state.perPage));
          if (state.page > pages) state.page = pages;
          var start = (state.page - 1) * state.perPage;
          var shown = pool.slice(start, start + state.perPage);

          cards.forEach(function (c) { c.el.classList.add('is-hidden'); });
          shown.forEach(function (c) { c.el.classList.remove('is-hidden'); });

          var total = pool.length;
          countEl.textContent = total;
          if (countTotalEl) countTotalEl.textContent = total ? ((start + 1) + '-' + (start + shown.length) + ' / ' + total) : '0';
          if (emptyEl) {
            emptyEl.style.display = total ? 'none' : 'flex';
            if (!total) {
              var t = emptyEl.querySelector('.md-empty-text');
              if (t) {
                t.textContent = (state.q || state.tag || state.owner)
                  ? (state.tag ? '没有找到标签为「' + state.tag + '」的知识库，试试其他标签或清除筛选。'
                      : (state.owner ? '「' + state.owner + '」暂无公开知识库。'
                          : '没有找到与「' + input.value.trim() + '」相关的知识库，换个关键词试试。'))
                  : '暂无公开知识库，去管理后台创建第一个吧。';
              }
            }
          }
          if (emptyBtn) emptyBtn.style.display = (state.q || state.tag || state.owner) ? 'inline-flex' : 'none';
          buildPager(pages);
          /* 按当前排序/筛选物理重排卡片节点，使顺序变化在视觉上可见 */
          var order = shown.map(function (c) { return c.el; });
          cards.forEach(function (c) { if (shown.indexOf(c) === -1) order.push(c.el); });
          if (emptyEl) order.push(emptyEl);
          order.forEach(function (el) { gridEl.appendChild(el); });
          listArea.scrollTop = 0;
        }

        function buildPager(pages) {
          var buttons = [];
          var cur = state.page;
          var add = function (b) { buttons.push(b); return b; };
          var nav = function (label, dir, disabled) {
            var b = document.createElement('button');
            b.type = 'button'; b.innerHTML = dir < 0 ? '‹' : '›';
            b.setAttribute('aria-label', label);
            if (disabled) b.disabled = true;
            else b.addEventListener('click', function () { state.page = cur + dir; render(); });
            add(b);
          };
          var num = function (n, active) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = n;
            if (active) b.className = 'active';
            b.addEventListener('click', function () { state.page = n; render(); });
            add(b);
          };
          var sep = function () {
            var s = document.createElement('button'); s.type = 'button'; s.className = 'sep';
            s.textContent = '…'; s.disabled = true; add(s);
          };

          nav('上一页', -1, cur <= 1);
          if (pages <= 7) { for (var i = 1; i <= pages; i++) num(i, i === cur); }
          else {
            num(1, cur === 1);
            if (cur > 3) sep();
            for (var j = Math.max(2, cur - 1); j <= Math.min(pages - 1, cur + 1); j++) num(j, j === cur);
            if (cur < pages - 2) sep();
            num(pages, cur === pages);
          }
          nav('下一页', 1, cur >= pages);

          pagerEl.innerHTML = '';
          buttons.forEach(function (b) { pagerEl.appendChild(b); });
        }

        /* 清除全部筛选 */
        function resetFilters() {
          state.q = ''; state.tag = ''; state.owner = ''; state.page = 1;
          input.value = '';
          document.querySelectorAll('.tag-chip').forEach(function (b) { b.classList.remove('active'); });
          document.querySelectorAll('.owner-chip').forEach(function (o) { o.classList.remove('active'); });
          render();
        }

        /* 搜索 */
        var input = document.getElementById('md-search-input');
        input.addEventListener('input', function () { state.q = input.value.trim().toLowerCase(); state.page = 1; render(); });
        document.addEventListener('keydown', function (e) { if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); } });

        /* 排序 */
        document.getElementById('md-sort').addEventListener('change', function (e) { state.sort = e.target.value; state.page = 1; render(); });

        /* 查看全部 / 清除筛选 */
        var moreBtn = document.getElementById('sb-recent-more');
        if (moreBtn) moreBtn.addEventListener('click', resetFilters);
        if (emptyBtn) emptyBtn.addEventListener('click', resetFilters);

        /* 视图切换 */
        var viewBtns = document.querySelectorAll('.md-view button');
        function applyView(v) {
          gridEl.classList.toggle('is-card', v === 'card');
          gridEl.classList.toggle('is-list', v === 'list');
          viewBtns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-view') === v); });
        }
        viewBtns.forEach(function (b) {
          b.addEventListener('click', function () { state.view = b.getAttribute('data-view'); applyView(state.view); });
        });

        render();
      })();
    </script>
  </body>
</html>
