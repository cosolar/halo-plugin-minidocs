<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title>知识库列表</title>
    <style>
      .md-kb-list {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      .md-kb-list h1 { font-size: 26px; margin: 0 0 20px; }
      .md-kb-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .md-kb-card {
        display: block;
        border: 1px solid var(--md-border, #e5e7eb);
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        background: #fff;
        transition: box-shadow .15s ease, transform .15s ease;
      }
      .md-kb-card:hover {
        box-shadow: 0 6px 20px rgba(0,0,0,.08);
        transform: translateY(-2px);
      }
      .md-kb-cover {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: var(--md-active, #f3f4f6);
      }
      .md-kb-body { padding: 14px 16px; }
      .md-kb-title { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
      .md-kb-desc {
        font-size: 13px;
        color: #6b7280;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .md-empty { color: #9ca3af; padding: 40px 0; text-align: center; }
    </style>
  </th:block>

  <th:block th:fragment="content">
    <div class="md-kb-list">
      <h1>知识库</h1>
      <div class="md-kb-grid"
           th:with="result=${minidocsFinder.listKnowledgeBases(1, 100)}">
        <a class="md-kb-card"
           th:each="kb : ${result.items}"
           th:href="@{'/docs/view/' + ${kb.spec.slug != null && !kb.spec.slug.isEmpty() ? kb.spec.slug : kb.metadata.name}}">
          <img class="md-kb-cover"
               th:if="${kb.spec.cover != null and !kb.spec.cover.isEmpty()}"
               th:src="${kb.spec.cover}" alt="">
          <div class="md-kb-body">
            <p class="md-kb-title" th:text="${kb.spec.displayName}"></p>
            <p class="md-kb-desc" th:text="${kb.spec.description} ?: '暂无简介'"></p>
          </div>
        </a>
        <div th:if="${result.items.isEmpty()}" class="md-empty">暂无公开知识库。</div>
      </div>
    </div>
  </th:block>
</html>
