<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="${knowledgeBase.spec.displayName} + ' - 知识库'"></title>
    <style>
      .minidocs-share {
        --md-sidebar-w: 280px;
        --md-outline-w: 240px;
        display: grid;
        grid-template-columns: var(--md-sidebar-w) minmax(0, 1fr) var(--md-outline-w);
        gap: 24px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      .md-sidebar, .md-outline {
        position: sticky;
        top: 24px;
        align-self: start;
        max-height: calc(100vh - 48px);
        overflow: auto;
      }
      .md-sidebar {
        border-right: 1px solid var(--md-border, #e5e7eb);
        padding-right: 16px;
      }
      .md-outline {
        border-left: 1px solid var(--md-border, #e5e7eb);
        padding-left: 16px;
        font-size: 14px;
      }
      .md-tree, .md-tree ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .md-tree ul { padding-left: 16px; }
      .md-tree a {
        display: block;
        padding: 6px 8px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .md-tree a:hover, .md-tree a.active {
        background: var(--md-active, #f3f4f6);
        color: var(--md-active-color, #2563eb);
      }
      .md-kb-title { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
      .md-article { min-width: 0; }
      .md-article h1 { font-size: 28px; margin-top: 0; }
      .md-article .content { line-height: 1.75; }
      .md-article .content pre {
        background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow: auto;
      }
      .md-article .content img { max-width: 100%; }
      .md-article .content table { width: 100%; border-collapse: collapse; }
      .md-article .content th, .md-article .content td {
        border: 1px solid var(--md-border, #e5e7eb); padding: 8px;
      }
      .md-outline-title { font-weight: 600; margin-bottom: 8px; }
      .md-outline a { color: inherit; text-decoration: none; display: block; padding: 3px 0; }
      .md-outline a:hover { color: var(--md-active-color, #2563eb); }
      .md-empty { color: #9ca3af; padding: 40px 0; text-align: center; }
      @media (max-width: 1024px) {
        .minidocs-share { grid-template-columns: 1fr; }
        .md-sidebar, .md-outline { position: static; max-height: none; border: none; }
      }
    </style>
  </th:block>

  <th:block th:fragment="content">
    <div class="minidocs-share"
         th:with="knowledgeBase=${minidocsFinder.getKnowledgeBase(kbSlug)},
                  docTree=${minidocsFinder.getDocTree(kbSlug)},
                  docSlug=${docSlug != null ? docSlug : (docTree.isEmpty() ? null : docTree[0].slug)},
                  doc=${docSlug != null ? minidocsFinder.getDocBySlug(docSlug) : null}">
      <!-- 左侧：知识库文档树 -->
      <aside class="md-sidebar">
        <h2 class="md-kb-title" th:text="${knowledgeBase.spec.displayName}"></h2>
        <ul class="md-tree">
          <li th:each="node : ${docTree}" th:replace="~{:: treenode(node=${node})}"></li>
        </ul>
      </aside>

      <!-- 中间：文章阅读区 -->
      <main class="md-article">
        <div th:if="${doc}" id="md-article-body">
          <h1 th:text="${doc.spec.title}"></h1>
          <div class="content" th:utext="${doc.spec.content}"></div>
        </div>
        <div th:unless="${doc}" class="md-empty">该知识库暂无已发布文档。</div>
      </main>

      <!-- 右侧：文章大纲（由前端根据阅读区标题生成） -->
      <aside class="md-outline" id="md-outline">
        <div class="md-outline-title">大纲</div>
        <nav id="md-outline-nav"></nav>
      </aside>
    </div>

    <!-- 文档树递归片段 -->
    <th:block th:fragment="treenode(node)">
      <a href="#"
         th:attr="data-slug=${node.slug}, data-name=${node.name}"
         th:text="${node.title}"
         th:classappend="${(docSlug != null ? docSlug : (doc != null ? doc.spec.slug : '_')) == node.slug} ? ' active' : ''"
         onclick="event.preventDefault(); location.search = '?docSlug=' + (this.dataset.slug || this.dataset.name);">
      </a>
      <ul th:if="${node.children != null and !node.children.isEmpty()}">
        <li th:each="child : ${node.children}" th:replace="~{:: treenode(node=${child})}"></li>
      </ul>
    </th:block>

    <script th:inline="javascript">
      (function () {
        var body = document.getElementById('md-article-body');
        var nav = document.getElementById('md-outline-nav');
        if (!body || !nav) return;
        var heads = body.querySelectorAll('h1, h2, h3, h4, h5, h6');
        heads.forEach(function (h, i) {
          if (!h.id) h.id = 'h-' + i;
          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent;
          a.style.paddingLeft = ((parseInt(h.tagName.charAt(1)) - 1) * 12) + 'px';
          nav.appendChild(a);
        });
      })();
    </script>
  </th:block>
</html>
