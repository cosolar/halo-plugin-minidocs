apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-minidocs-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "知识库"
    rbac.authorization.halo.run/ui-permissions: '["plugin:halo-plugin-minidocs:knowledgebase:view"]'
    rbac.authorization.halo.run/display-name: "知识库查看"
rules:
  - apiGroups: [ "minidocs.halo.run", "console.api.minidocs.halo.run" ]
    resources:
      - "knowledgebases"
      - "knowledgebases/settings"
      - "knowledgebasedocs"
      - "knowledgebases/tree"
      - "knowledgebases/docs"
      - "knowledgebases/docs/export"
    verbs: [ "get", "list" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-minidocs-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: '["role-template-minidocs-view"]'
    rbac.authorization.halo.run/ui-permissions: '["plugin:halo-plugin-minidocs:knowledgebase:manage"]'
    rbac.authorization.halo.run/module: "知识库"
    rbac.authorization.halo.run/display-name: "知识库管理"
rules:
  - apiGroups: [ "minidocs.halo.run", "console.api.minidocs.halo.run" ]
    resources:
      - "knowledgebases"
      - "knowledgebasedocs"
      - "knowledgebases/tree"
      - "knowledgebases/docs"
      - "knowledgebases/docs/publish"
      - "knowledgebases/docs/move"
      - "knowledgebases/docs/export"
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]
  # 供知识库成员选择器（UserSelect）读取用户列表，用于设置/展示知识库成员
  - apiGroups: [ "api.console.halo.run" ]
    resources: [ "users" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "" ]
    resources: [ "users" ]
    verbs: [ "get", "list" ]
  # 供编辑器/封面本地图片上传（attach upload）使用
  - apiGroups: [ "console.api.storage.halo.run" ]
    resources: [ "attachments/upload" ]
    verbs: [ "create" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-minidocs-anonymous
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
rules:
  - apiGroups: [ "api.minidocs.halo.run" ]
    resources:
      - "knowledgebases"
      - "docs"
      - "knowledgebases/tree"
      - "knowledgebases/docs"
      - "knowledgebases/stats"
      - "knowledgebases/like"
      - "share"
      - "share/stats"
      - "share/like"
    verbs: [ "get", "list", "create" ]
