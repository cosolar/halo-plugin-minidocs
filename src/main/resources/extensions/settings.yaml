apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-plugin-minidocs-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: siteName
          label: 站点名称
          value: 知识库
        - $formkit: textarea
          name: description
          label: 站点描述
        - $formkit: switch
          name: allowAnonymousRead
          label: 允许未登录用户阅读公开知识库
          value: false
        - $formkit: switch
          name: allowDocExport
          label: 允许导出文档（Markdown）
          value: true
        - $formkit: number
          name: previewWidth
          label: 预览阅读宽度（px）
          value: 960
          help: 预览模式下文章内容的阅读宽度，默认 960px
