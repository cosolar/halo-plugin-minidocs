apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-plugin-minidocs-settings
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: switch
          name: allowAnonymousRead
          label: 允许未登录用户阅读公开知识库
          value: false
        - $formkit: switch
          name: allowDocExport
          label: 允许导出文档（Markdown）
          value: true
        - $formkit: select
          name: codeBlockTheme
          label: 代码块高亮主题
          value: default
          help: 选择 Markdown 编辑器中代码块的高亮主题，保存后刷新页面生效
          options:
            - label: 默认（GitHub 风格浅色）
              value: default
            - label: One Light
              value: one-light
            - label: Solarized Light
              value: solarized-light
            - label: VS Light
              value: vs-light
            - label: Coy
              value: coy
            - label: Funky
              value: funky
            - label: Dark
              value: dark
            - label: One Dark
              value: one-dark
            - label: Okaidia
              value: okaidia
            - label: Twilight
              value: twilight
            - label: VS Dark
              value: vs-dark
